# FoodTrack - projet final - configuration du portail qualite
#
# Trois cles :
#  - default.conf -> /etc/nginx/conf.d/default.conf   (reverse proxy vers l API)
#  - index.html   -> /usr/share/nginx/html/index.html (page du portail)
#  - SEUIL_TEMPERATURE_C : reglage metier, a faire varier par environnement
#
# C est ici que se joue la separation des environnements : le contenu de ce
# ConfigMap doit differer entre foodtrack-dev, foodtrack-test et foodtrack-prod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: foodtrack-config
  namespace: foodtrack
  labels:
    app.kubernetes.io/name: portail-qualite
    app.kubernetes.io/part-of: foodtrack
data:
  SEUIL_TEMPERATURE_C: "4"
  NIVEAU_JOURNAL: "debug"
  default.conf: |
    server {
        listen 8080;
        server_name _;

        # sonde applicative : ne depend d aucun backend.
        # C est ce chemin que la sonde de disponibilite doit viser, et donc
        # celui que le test de sante de l equilibreur de charge reprendra.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # reverse proxy vers l API capteurs (service ClusterIP du meme namespace)
        location /api/ {
            proxy_pass http://api-capteurs:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
  index.html: |
    <!doctype html>
    <html lang="fr">
      <head><meta charset="utf-8"><title>FoodTrack - suivi qualite</title></head>
      <body>
        <h1>FoodTrack - suivi qualite</h1>
        <p>Tracabilite de la chaine du froid. API des releves de temperature sous /api/.</p>
        <p>Environnement : a differencier par environnement.</p>
      </body>
    </html>
