# FoodTrack - projet final - tier API capteurs
#
# hello-app:2.0 repond 200 sur "/" et renvoie son nom de pod : c est ce qui
# permet d observer quel pod sert la requete pendant une mise a jour ou une
# montee en charge.
#
# C est ce deploiement que le pipeline met a jour, et c est lui que vous
# confiez a un HorizontalPodAutoscaler en phase 2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-capteurs
  namespace: foodtrack
  labels:
    app.kubernetes.io/name: api-capteurs
    app.kubernetes.io/part-of: foodtrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-capteurs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-capteurs
        app.kubernetes.io/name: api-capteurs
        app.kubernetes.io/part-of: foodtrack
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: us-docker.pkg.dev/google-samples/containers/gke/hello-app:2.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SEUIL_TEMPERATURE_C
              valueFrom:
                configMapKeyRef:
                  name: foodtrack-config
                  key: SEUIL_TEMPERATURE_C
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: foodtrack-api-config
                  key: INGEST_TOKEN
          resources:
            # sans requests.cpu, un HorizontalPodAutoscaler sur l utilisation
            # processeur reste bloque en <unknown> : il n a rien a diviser.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # laisse a l equilibreur le temps de retirer l endpoint avant que
              # le processus ne recoive SIGTERM.
              sleep:
                seconds: 10
