# FoodTrack - projet final - namespace de depart
#
# Ce manifeste ne cree QU UN namespace. Le projet en attend trois :
# foodtrack-dev, foodtrack-test et foodtrack-prod.
# A vous de decider comment vous les produisez (copie, substitution, kustomize)
# et de justifier votre choix.
apiVersion: v1
kind: Namespace
metadata:
  name: foodtrack
  labels:
    app.kubernetes.io/part-of: foodtrack
    foodtrack.example/env: dev
