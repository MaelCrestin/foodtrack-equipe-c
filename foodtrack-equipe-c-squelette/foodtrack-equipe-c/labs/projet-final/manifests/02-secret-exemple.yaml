# FoodTrack - projet final - secret d EXEMPLE, aucune valeur reelle
#
# Un Secret Kubernetes n est pas chiffre cote application : il est encode en
# base64 et stocke dans etcd. Sur GKE, etcd est chiffre au repos par Google.
# Encode ne veut pas dire protege : "kubectl get secret -o yaml" rend la valeur
# en clair a quiconque a le droit de lire les secrets du namespace.
#
# Ne committez JAMAIS de valeur reelle ici. Le projet attend de vous que vous
# expliquiez comment les vraies valeurs entrent dans le cluster, et que le
# depot n en porte aucune, historique compris.
apiVersion: v1
kind: Secret
metadata:
  name: foodtrack-api-config
  namespace: foodtrack
  labels:
    app.kubernetes.io/name: api-capteurs
    app.kubernetes.io/part-of: foodtrack
type: Opaque
stringData:
  INGEST_TOKEN: "A-REMPLACER-HORS-DU-DEPOT"
  CACHE_PASSWORD: "A-REMPLACER-HORS-DU-DEPOT"
