# FoodTrack - projet final - classe de stockage sur disque HDD
#
# POURQUOI CE FICHIER EXISTE
#
# Les classes de stockage livrees avec GKE provisionnent toutes du disque
# adosse a du SSD : standard-rwo utilise pd-balanced, premium-rwo utilise
# pd-ssd. Les deux consomment le quota regional SSD_TOTAL_GB, plafonne a
# 250 Go sur un projet neuf et non relevable a la demande.
#
# pd-standard, lui, consomme DISKS_TOTAL_GB, un quota bien plus large.
# C est la seule facon de faire tenir trois environnements avec volume
# persistant dans le budget de quota de la session.
#
# volumeBindingMode: WaitForFirstConsumer est essentiel : sans lui, le disque
# est cree des la creation du PVC, dans une zone choisie par le provisionneur,
# qui peut ne pas etre celle ou le pod sera ordonnance. Le pod reste alors
# Pending sur un conflit d affinite de volume.
#
# allowVolumeExpansion autorise l agrandissement du volume sans recreation.
# reclaimPolicy: Delete supprime le disque avec le PVC - adapte a un projet de
# formation, a rediscuter pour une vraie production.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: foodtrack-hdd
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-standard
  csi.storage.k8s.io/fstype: ext4
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
