# FoodTrack - projet final - services des trois tiers
#
# Les trois services sont livres en ClusterIP : l application fonctionne en
# interne, mais rien n est joignable depuis l exterieur.
#
# L exposition par Ingress est a votre charge (phase 2).
#
# Sur un cluster en mode natif VPC, GKE annote lui-meme les Services ClusterIP
# references par un Ingress (cloud.google.com/neg) et cree le groupe de points
# de terminaison reseau correspondant : l equilibreur joint les pods
# directement. Ces Services restent donc en ClusterIP, contrairement a ce que
# demandent les documentations ecrites avant l equilibrage natif conteneur.
#
# Le cache est un service headless (clusterIP: None) : chaque replica du
# StatefulSet obtient un nom DNS stable cache-releves-0.cache-releves...
---
apiVersion: v1
kind: Service
metadata:
  name: portail-qualite
  namespace: foodtrack
  labels:
    app.kubernetes.io/name: portail-qualite
    app.kubernetes.io/part-of: foodtrack
spec:
  type: ClusterIP
  selector:
    app: portail-qualite
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: api-capteurs
  namespace: foodtrack
  labels:
    app.kubernetes.io/name: api-capteurs
    app.kubernetes.io/part-of: foodtrack
spec:
  type: ClusterIP
  selector:
    app: api-capteurs
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: cache-releves
  namespace: foodtrack
  labels:
    app.kubernetes.io/name: cache-releves
    app.kubernetes.io/part-of: foodtrack
spec:
  clusterIP: None
  selector:
    app: cache-releves
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
