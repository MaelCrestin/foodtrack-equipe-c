apiVersion: v1
kind: ConfigMap
metadata:
  name: foodtrack-config
  labels:
    app.kubernetes.io/name: portail-qualite
data:
  SEUIL_TEMPERATURE_C: "8"
  NIVEAU_JOURNAL: "debug"
  default.conf: |
    server {
        listen 8080;
        server_name _;
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
        location /api/ {
            proxy_pass http://api-capteurs:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
  index.html: |
    <!doctype html>
    <html lang="fr">
      <head><meta charset="utf-8"><title>FoodTrack</title></head>
      <body>
        <h1>FoodTrack</h1>
        <p>Environnement : DEV</p>
        <p>API des relevés de température sous <code>/api/</code>.</p>
      </body>
    </html>

