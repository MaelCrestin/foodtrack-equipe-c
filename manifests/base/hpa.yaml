apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-capteurs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-capteurs
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

